# APP_ENV is required by next.config.mjs; a build without it fails.
[context.production.environment]
  APP_ENV = "production"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-1ZK1RC1RE1"

[context.deploy-preview.environment]
  APP_ENV = "preview"

[context.branch-deploy.environment]
  APP_ENV = "preview"

[context.staging.environment]
  APP_ENV = "preview"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-8GQC9DS1S7"
