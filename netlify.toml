# APP_ENV is required by next.config.mjs; a build without it fails.
[context.production.environment]
  APP_ENV = "production"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-1ZK1RC1RE1"

[context.deploy-preview.environment]
  APP_ENV = "preview"

[context.branch-deploy.environment]
  APP_ENV = "preview"

[context.staging.environment]
  APP_ENV = "preview"
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-8GQC9DS1S7"

# Pipeline jobs (ADR 0001). Netlify's bundler leaves the generated Prisma
# client's require("@prisma/client-runtime-utils") external, but cannot copy
# that package (its exports map hides package.json), so the function fails
# with "Cannot find module". Ship it explicitly.
[functions."detect-publish*"]
  included_files = ["node_modules/@prisma/client-runtime-utils/**"]

[functions."ingest-stories*"]
  included_files = ["node_modules/@prisma/client-runtime-utils/**"]

[functions."run-checks*"]
  included_files = ["node_modules/@prisma/client-runtime-utils/**"]
